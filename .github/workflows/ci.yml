name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore FinancialAI.sln
      - run: dotnet build FinancialAI.sln -c Release --no-restore
      - name: Run unit tests (no emulator required)
        run: |
          dotnet test tests/FinancialAI.UnitTests -c Release --no-build --collect:"XPlat Code Coverage"
          dotnet test tests/FinancialAI.EvaluationTests -c Release --no-build

  dotnet-integration:
    runs-on: ubuntu-latest
    # Only run integration tests on push to main; PRs stay fast.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Start Cosmos emulator
        run: docker run -d --name cosmos-emulator
          -p 8081:8081 -p 1234:1234 -p 8082:8080
          -e AZURE_COSMOS_EMULATOR_PARTITION_COUNT=1
          mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext

      - name: Wait for emulator
        run: |
          for i in {1..60}; do
            if curl -k -s -o /dev/null -w "%{http_code}" \
                https://localhost:8081/_explorer/emulator.pem | grep -q 200; then
              echo "Emulator ready"; exit 0
            fi
            sleep 5
          done
          echo "Emulator did not start"; exit 1

      - run: dotnet restore FinancialAI.sln
      - run: dotnet build FinancialAI.sln -c Release --no-restore
      - name: Run integration tests
        run: >
          dotnet test tests/FinancialAI.IntegrationTests/FinancialAI.IntegrationTests.csproj
          -c Release --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
