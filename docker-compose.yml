services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    container_name: financialai-cosmos
    ports:
      - "8081:8081"
      - "1234:1234"
      - "8082:8080"
    command: --protocol https
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=10
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true
      - PROTOCOL=https

  ai:
    build:
      context: ./services/ai
    container_name: financialai-ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LLM_PROVIDER=stub
      # To try a real provider without editing this file:
      #   $env:LLM_PROVIDER="real"; $env:LLM_PRESET="groq"; $env:LLM_API_KEY="..."
      #   docker compose up -d --force-recreate ai
      # Presets: openrouter, groq, gemini, cerebras, mistral, github, ollama      # For real model: set LLM_PROVIDER=real and provide LLM_API_KEY via .env.
  api:
    build:
      context: .
      dockerfile: src/FinancialAI.Api/Dockerfile
    container_name: financialai-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Cosmos__ConnectionString=AccountEndpoint=https://cosmos:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;
      - Cosmos__UseEmulator=true
      - AiService__BaseUrl=http://ai:8000
      - ServiceBus__Enabled=true
      - ServiceBus__UseEmulator=true
      - Auth__SigningKey=dev-only-signing-key-replace-in-production-minimum-32-chars-abcdef
    depends_on:
      - cosmos
      - ai

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    container_name: financialai-web
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_API_BASE_URL=http://api:8080
    depends_on:
      - api


