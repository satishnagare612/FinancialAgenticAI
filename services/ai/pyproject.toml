[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."

[tool.poetry]
name = "financialai-ai"
version = "0.1.0"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
fastapi = "^0.162.0"
uvicorn = "^0.54.0"
pydantic = "^2.14.1"
pydantic-settings = "^2.16.1"
httpx = "^0.28.1"
langgraph = "^1.2.18"
langchain-core = "^1.7.0"
langchain-text-splitters = "^1.1.3"
structlog = "^26.1.0"
python = ">=3.11,<4.0.0"
langchain-openai = "^1.7.3"
langchain-google-genai = { version = "^3.0.0", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
ruff = "^0.17.3"
mypy = "^2.4.0"
pytest-asyncio = "^1.4.1"

[project]
name = "financialai-ai"
version = "0.1.0"
requires-python = ">=3.11,<4.0.0"
